  marketing:
    image: fastapi/marketing
    container_name: marketing
    build:
      context: ./marketing
      target: development
    ports:
      - "6080:80"
    networks:
      apisix:

  admin:
    image: fastapi/admin
    container_name: admin
    build:
      context: ./admin
    ports:
      - "6081:80"
    networks:
      apisix:

  keycloakweb:
    image: mykeycloak
    restart: on-failure
    ports:
      - "18080:18080"
      - "18443:18443"
      - "19000:19000"
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      DB_VENDOR: postgres
      DB_USER: root
      DB_PASSWORD: electron
      KC_DB_URL: "jdbc:postgresql://keycloakdb:15432/keycloak"
      KC_DB: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: electron
      KC_HOSTNAME: "https://keycloakweb:18443"
      KC_HOSTNAME_ADMIN: "https://keycloakweb:18443"
      KEYCLOAK_FRONTEND_URL: "http://keycloakweb/auth"
      KC_HTTP_PORT: 18080
      KC_HTTPS_PORT: 18443
      KC_HTTP_MANAGEMENT_PORT: 19000
    volumes:
      - ./keycloak/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf
    networks:
      keycloak-net:
      apisix:

  keycloakdb:
    image: postgres:latest
    restart: on-failure
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: electron
      PGPORT: 15432
    ports:
      - "15432:15432"
    volumes:
      - ./keycloak/postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
      
networks:
  apisix:
    driver: bridge
  keycloak-net:
    driver: bridge

volumes:
  etcd_data:
    driver: local
